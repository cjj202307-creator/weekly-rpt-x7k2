name: OKR Push Notify

# 独立推送任务：与每小时的静默抓取(okr-weekly.yml)分离，仅手动触发（无定时，防重复推送）
on:
  workflow_dispatch: # 仅允许手动触发（立即推送一条链接到个人 + 全国网点部门经理群）

jobs:
  okr-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send OKR Report Link
        env:
          DINGTALK_APP_KEY: ${{ secrets.DINGTALK_APP_KEY }}
          DINGTALK_APP_SECRET: ${{ secrets.DINGTALK_APP_SECRET }}
          DINGTALK_USER_ID: '17397552280041830'
          DINGTALK_PUSH_ENABLED: 'true' # 只在本推送任务中打开总开关
          DINGTALK_GROUP_PUSH_ENABLED: 'true' # 开启群推送
          DINGTALK_GROUP_WEBHOOK_MANAGER: ${{ secrets.DINGTALK_GROUP_WEBHOOK_MANAGER }} # 全国网点部门经理群
          REPORT_URL: ${{ vars.REPORT_URL }}
          REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
        run: python cloud/okr_cloud_report.py --send-only
